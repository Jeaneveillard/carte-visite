<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte de Visite - Jean Eveillard Cazeau</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <!-- Face de la carte -->
            <div class="card-front">
                <div class="logo-container">
                    <img src="../JEC/icon-512.png" alt="Logo KZO InspectPro" class="logo">
                </div>
                <div class="info-container">
                    <h1 class="name">Jean Eveillard Cazeau</h1>
                    <h2 class="title">Inspecteur</h2>
                    
                    <div class="contact-info">
                        <div class="contact-item">
                            <i class="fas fa-phone-alt"></i>
                            <span>438-368-6703</span>
                        </div>
                        <div class="contact-item">
                            <i class="fas fa-envelope"></i>
                            <span>kzoinspectpro@gmail.com</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Dos de la carte (visible au survol) -->
            <div class="card-back">
                <img src="../JEC/icon-512.png" alt="Logo KZO InspectPro" class="logo-large">
                <h3 class="company-name">KZO InspectPro</h3>
                <p class="tagline">L'excellence en inspection</p>
                
                <div class="services-list">
                    <span>Pré-achat</span> &bull; 
                    <span>Pré-vente</span> &bull; 
                    <span>Pré-réception</span>
                </div>
                
                <div class="website-link">
                    <i class="fas fa-globe"></i> www.kzoinspectpro.com
                </div>
            </div>
        </div>
    </div>
</body>
</html>
