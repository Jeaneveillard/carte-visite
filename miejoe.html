<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte de Visite - Kibbeh Mie Joe</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="miejoe_style.css">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <!-- Face de la carte -->
            <div class="card-front">
                <div class="logo-container">
                    <img src="../Marie Josee/Mie joe/assets/images/kibbey.png" alt="Logo Kibbeh Mie Joe" class="logo">
                </div>
                <div class="info-container">
                    <h1 class="name">Marie Josée Vaval</h1>
                    <h2 class="title">Fondatrice & Créatrice de Saveurs</h2>
                    
                    <div class="contact-info">
                        <div class="contact-item">
                            <i class="fas fa-phone-alt"></i>
                            <span>786-413-7988</span>
                        </div>
                        <div class="contact-item">
                            <i class="fas fa-envelope"></i>
                            <span>mvaval43@gmail.com</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Dos de la carte (visible au survol) -->
            <div class="card-back">
                <img src="../Marie Josee/Mie joe/assets/images/kibbey.png" alt="Kibbeh Mie Joe" class="logo-large">
                <h3 class="company-name">Kibbeh Mie Joe</h3>
                <p class="tagline">L'Authentique Saveur Libanaise</p>
                
                <div class="services-list">
                    <span>Mariages</span> &bull; 
                    <span>Baptêmes</span> &bull; 
                    <span>Anniversaires</span>
                </div>
                
                <div class="social-link">
                    <i class="fas fa-star"></i> Spécial Cérémonies & Gros
                </div>
            </div>
        </div>
    </div>
</body>
</html>
